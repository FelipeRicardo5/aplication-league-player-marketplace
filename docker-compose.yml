services:
  db:
    image: postgres:16-alpine
    container_name: league-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: league
      POSTGRES_PASSWORD: league
      POSTGRES_DB: league_marketplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U league -d league_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
