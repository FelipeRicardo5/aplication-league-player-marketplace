services:
  db:
    image: postgres:16-alpine
    container_name: league-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: league
      POSTGRES_PASSWORD: league
      POSTGRES_DB: league_marketplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U league -d league_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: league-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://league:league@db:5432/league_marketplace?schema=public
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata:
